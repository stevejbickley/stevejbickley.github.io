name: Refresh research metrics

on:
  schedule:
    - cron: '23 20 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-metrics.yml'
      - 'scripts/metrics.py'
      - 'scripts/update_metrics.py'

permissions:
  contents: write
  pages: write

concurrency:
  group: research-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test metric validation and cache handling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh public snapshots
        run: python3 scripts/update_metrics.py
      - name: Update static pages
        run: python3 scripts/finalize.py
      - name: Commit refreshed snapshots
        run: |
          git add data/research-metrics.json docs/*.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh public research metrics'
            git push
          fi
      # Commits made with GITHUB_TOKEN do not themselves trigger a Pages build.
      - name: Publish the static snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
